<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>HoneyTrace Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

    background:#0d1117;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    color:white;

}

.login-box{

    width:420px;

    background:#161b22;

    padding:35px;

    border-radius:15px;

    box-shadow:0 0 25px rgba(0,255,120,.25);

}

input{

    margin-bottom:15px;

}

</style>

</head>

<body>

<div class="login-box">

<h2 class="text-center text-success mb-4">

🍯 HoneyTrace

</h2>

<form action="/" method="get">

<input
class="form-control"
placeholder="Username"
required>

<input
type="password"
class="form-control"
placeholder="Password"
required>

<button
class="btn btn-success w-100">

Login

</button>

</form>

</div>

</body>

</html>
